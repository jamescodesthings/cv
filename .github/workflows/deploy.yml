name: Build and Deploy

# Every branch builds the site and the PDFs, so a broken change fails on its branch.
# Only main publishes.
on:
  push:
    branches: ['**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: make build

      - name: Build PDFs
        run: make pdf

      - name: Build pages output
        run: make pages

      - name: Deploy to pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: pages
          # Keep a single commit on the pages branch so old builds (and the PDFs in them) don't linger.
          force_orphan: true
