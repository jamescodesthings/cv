<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <!-- LinkedIn profile banner. The left third stays empty because the profile photo covers it. -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@700&amp;display=swap');
      .label { font: 500 18px 'JetBrains Mono', monospace; letter-spacing: 0.2em; fill: #f59e0b; }
      .title { font: 700 64px 'Space Grotesk', sans-serif; letter-spacing: -0.01em; fill: #f0ece4; }
      .stack { font: 400 20px 'JetBrains Mono', monospace; fill: #9ca3af; }
      .sep { fill: #f59e0b; }
    </style>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1a1a22" stroke-width="1" />
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.28" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.7" stop-color="#fff" stop-opacity="1" />
    </linearGradient>
    <mask id="grid-mask">
      <rect width="1584" height="396" fill="url(#fade)" />
    </mask>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16" />
      <stop offset="0.6" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="#0a0a0f" />
  <rect width="1584" height="396" fill="url(#grid)" mask="url(#grid-mask)" />
  <ellipse cx="1214" cy="436" rx="450" ry="300" fill="url(#glow)" />

  <text class="label" x="1488" y="144" text-anchor="end">CODESTHINGS.COM</text>
  <text class="title" x="1488" y="219" text-anchor="end">Full-stack · Cloud · Mobile</text>
  <text class="stack" x="1488" y="265" text-anchor="end">Node.js <tspan class="sep">/</tspan> .NET <tspan class="sep">/</tspan> GCP <tspan class="sep">/</tspan> AWS</text>
</svg>
